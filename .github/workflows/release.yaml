name: Build and publish

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@v2.22.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            services.gradle.org:443
            release-assets.githubusercontent.com:443
            plugins.gradle.org:443
            plugins-artifacts.gradle.org:443
            repo.maven.apache.org:443
            downloads.gradle.org:443
            central.sonatype.com:443
      - uses: actions/checkout@v7.0.1
        name: Checkout
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.1.0
        name: Setup Java
        with:
          java-version: 25
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          dependency-graph: generate-and-submit
          cache-disabled: true
      - name: Test & build
        run: ./gradlew test build kotlinSourcesJar generateJavadocJar publishToMavenLocal
        env:
          VERSION: ${{ github.ref_name }}
      - name: Import GPG key
        run: |
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Assemble zip for Maven Central
        run: ./publishing/assemble.sh
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          VERSION: ${{ github.ref_name }}
      - name: Upload artifact to Maven Central
        run: |
          set -eo pipefail
          auth=$(printf "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" | base64)
          curl -X POST \
            -H "Authorization: Bearer $auth" \
            --form bundle=@$GITHUB_WORKSPACE/build/bundle/mvnbundle.zip \
            https://central.sonatype.com/api/v1/publisher/upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
